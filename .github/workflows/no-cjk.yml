name: no-cjk

on:
  pull_request:
  push:
    branches: [main]

jobs:
  no-cjk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reject CJK text in added lines
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node harness/sensors/no-cjk.mjs "$BASE" "$HEAD"
